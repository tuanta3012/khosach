name: Auto Build & Release APK & AAB from AI Studio

on:
  push:
    branches:
      - main
    paths:
      - package.json
      - scripts/prepare-release.mjs
      - .github/workflows/auto-release.yml
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: package-release-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. Cấu hình môi trường Node.js và JDK 21
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      # 2. Xác thực cấu hình phát hành và chỉ đọc version/buildAab từ package.json
      - name: Determine Auto Version
        id: auto_version
        run: |
          node scripts/prepare-release.mjs >> "$GITHUB_OUTPUT"

      # 3. Tạo init.gradle cấp hệ thống giải quyết triệt để lỗi BouncyCastle (bcprov) và androidx.browser
      - name: Create Gradle Init Script for BouncyCastle and AndroidX
        run: |
          mkdir -p ~/.gradle
          cat << 'EOF' > ~/.gradle/init.gradle
          allprojects {
              buildscript {
                  configurations.all {
                      resolutionStrategy {
                          force 'org.bouncycastle:bcprov-jdk15to18:1.70'
                          force 'org.bouncycastle:bcpkix-jdk15to18:1.70'
                          force 'org.bouncycastle:bcutil-jdk15to18:1.70'
                          force 'androidx.browser:browser:1.8.0'
                          eachDependency { details ->
                              if (details.requested.group == 'org.bouncycastle') {
                                  if (details.requested.name.startsWith('bcprov')) {
                                      details.useTarget 'org.bouncycastle:bcprov-jdk15to18:1.70'
                                  } else if (details.requested.name.startsWith('bcpkix')) {
                                      details.useTarget 'org.bouncycastle:bcpkix-jdk15to18:1.70'
                                  } else if (details.requested.name.startsWith('bcutil')) {
                                      details.useTarget 'org.bouncycastle:bcutil-jdk15to18:1.70'
                                  }
                              }
                              if (details.requested.group == 'androidx.browser' && details.requested.name == 'browser') {
                                  details.useVersion '1.8.0'
                              }
                          }
                      }
                  }
              }
              configurations.all {
                  resolutionStrategy {
                      force 'org.bouncycastle:bcprov-jdk15to18:1.70'
                      force 'org.bouncycastle:bcpkix-jdk15to18:1.70'
                      force 'org.bouncycastle:bcutil-jdk15to18:1.70'
                      force 'androidx.browser:browser:1.8.0'
                      eachDependency { details ->
                          if (details.requested.group == 'org.bouncycastle') {
                              if (details.requested.name.startsWith('bcprov')) {
                                  details.useTarget 'org.bouncycastle:bcprov-jdk15to18:1.70'
                              } else if (details.requested.name.startsWith('bcpkix')) {
                                  details.useTarget 'org.bouncycastle:bcpkix-jdk15to18:1.70'
                              } else if (details.requested.name.startsWith('bcutil')) {
                                  details.useTarget 'org.bouncycastle:bcutil-jdk15to18:1.70'
                              }
                          }
                          if (details.requested.group == 'androidx.browser' && details.requested.name == 'browser') {
                              details.useVersion '1.8.0'
                          }
                      }
                  }
              }
          }
          EOF

      # 4. Cài đặt các thư viện Node.js
      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps

      # 5. Khởi tạo lại thư mục Android nếu cần
      - name: Generate Fresh Android Project
        run: |
          if [ ! -f "android/build.gradle" ]; then
            echo "Thư mục android bị rỗng hoặc chưa hoàn chỉnh. Tiến hành khởi tạo mới..."
            rm -rf android
            npx cap add android
          fi

      # 6. Cập nhật SDK, strings.xml & Phiên bản Android
      - name: Update Android Config, SDK & Strings
        env:
          VERSION_CODE: ${{ steps.auto_version.outputs.CODE }}
          VERSION_NAME: ${{ steps.auto_version.outputs.NAME }}
        run: |
          mkdir -p android/app/src/main/res/values
          cat << 'EOF' > android/app/src/main/res/values/strings.xml
          <?xml version='1.0' encoding='utf-8'?>
          <resources>
              <string name="app_name">Kho sách</string>
              <string name="title_activity_main">Kho sách</string>
              <string name="package_name">com.khosach.app</string>
              <string name="custom_url_scheme">com.khosach.app</string>
          </resources>
          EOF

          if [ -f "android/variables.gradle" ]; then
            sed -i "s/minSdkVersion = .*/minSdkVersion = 23/g" android/variables.gradle
            sed -i "s/compileSdkVersion = .*/compileSdkVersion = 34/g" android/variables.gradle
            sed -i "s/targetSdkVersion = .*/targetSdkVersion = 34/g" android/variables.gradle
          fi
          test -f "android/app/build.gradle"
          sed -E -i "s/versionCode[[:space:]]+[0-9]+/versionCode $VERSION_CODE/g" android/app/build.gradle
          sed -E -i "s/versionName[[:space:]]+\"[^\"]*\"/versionName \"$VERSION_NAME\"/g" android/app/build.gradle
          grep -Eq "versionCode[[:space:]]+$VERSION_CODE" android/app/build.gradle
          grep -Eq "versionName[[:space:]]+\"$VERSION_NAME\"" android/app/build.gradle

          # Tạo thư mục res/xml và bộ quy tắc loại trừ sao lưu toàn diện cho Android 6 - Android 14+
          mkdir -p android/app/src/main/res/xml
          cat << 'EOF' > android/app/src/main/res/xml/data_extraction_rules.xml
          <?xml version="1.0" encoding="utf-8"?>
          <data-extraction-rules>
              <cloud-backup>
                  <exclude path="." />
              </cloud-backup>
              <device-transfer>
                  <exclude path="." />
              </device-transfer>
          </data-extraction-rules>
          EOF

          cat << 'EOF' > android/app/src/main/res/xml/backup_rules.xml
          <?xml version="1.0" encoding="utf-8"?>
          <full-backup-content>
              <exclude domain="root" path="." />
              <exclude domain="file" path="." />
              <exclude domain="database" path="." />
              <exclude domain="sharedpref" path="." />
              <exclude domain="external" path="." />
          </full-backup-content>
          EOF


          if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
            if ! grep -q "REQUEST_INSTALL_PACKAGES" android/app/src/main/AndroidManifest.xml; then
              sed -i '/<application/i \    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" \/>' android/app/src/main/AndroidManifest.xml
            fi
            # Cấu hình chống Android Cloud Backup & Restore đa tầng
            sed -i 's/android:allowBackup="true"/android:allowBackup="false"/g' android/app/src/main/AndroidManifest.xml
            sed -i 's/android:allowBackup="false"/android:allowBackup="false" android:fullBackupOnly="false" android:dataExtractionRules="@xml\/data_extraction_rules" android:fullBackupContent="@xml\/backup_rules"/g' android/app/src/main/AndroidManifest.xml
          fi

      # 7. Copy google-services.json & Tạo icon
      - name: Copy google-services.json & Generate Icons
        run: |
          if [ -f "google-services.json" ]; then
            mkdir -p android/app
            cp google-services.json android/app/google-services.json
          fi
          node scripts/generate_all_icons.js || true
          npx @capacitor/assets generate --android || true

      # 8. Khởi tạo & Cấu hình Keystore cố định trong Repo cho cả Release và Debug
      - name: Setup Permanent Fixed Keystore
        run: |
          mkdir -p keystore ~/.android android/app
          
          if [ -f "keystore/debug.keystore.b64" ]; then
            echo "Khôi phục Keystore cố định từ keystore/debug.keystore.b64..."
            base64 -d keystore/debug.keystore.b64 > keystore/debug.keystore
          elif [ ! -f "keystore/debug.keystore" ]; then
            echo "Khởi tạo Keystore cố định cho Repository..."
            keytool -genkeypair -v \
              -keystore keystore/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug, O=Android, C=US"
            base64 -w 0 keystore/debug.keystore > keystore/debug.keystore.b64
          fi
          
          cp keystore/debug.keystore ~/.android/debug.keystore
          cp keystore/debug.keystore android/app/debug.keystore
          
          if [ -f "android/app/build.gradle" ]; then
            node -e '
              const fs = require("fs");
              let content = fs.readFileSync("android/app/build.gradle", "utf8");
              if (!content.includes("signingConfigs")) {
                content = content.replace("buildTypes {", `signingConfigs {
                    release {
                        storeFile file("debug.keystore")
                        storePassword "android"
                        keyAlias "androiddebugkey"
                        keyPassword "android"
                    }
                    debug {
                        storeFile file("debug.keystore")
                        storePassword "android"
                        keyAlias "androiddebugkey"
                        keyPassword "android"
                    }
                }
                buildTypes {`);
              }
              if (!content.includes("signingConfig signingConfigs.release")) {
                content = content.replace(/buildTypes\s*\{([\s\S]*?)release\s*\{/, "buildTypes {$1release {\n            signingConfig signingConfigs.release");
              }
              fs.writeFileSync("android/app/build.gradle", content, "utf8");
            '
          fi
          
          SHA1_VAL=$(keytool -list -v -keystore keystore/debug.keystore -alias androiddebugkey -storepass android | grep "SHA1:" | head -1 | awk '{print $2}')
          echo "===================================================="
          echo "=== PERMANENT SHA-1 FINGERPRINT ===================="
          echo "SHA-1: $SHA1_VAL"
          echo "===================================================="

      # =======================================================================
      # LUỒNG 1: BUILD BẢN APK (PUBLIC GITHUB RELEASE + AUTO UPDATE BẬT)
      # =======================================================================
      - name: "[Luồng 1 - APK] Build Web Assets (Auto Update ENABLED)"
        if: steps.auto_version.outputs.BUILD_AAB != 'true'
        run: |
          npm run build
          npx cap sync android
          if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
            sed -i 's/android:allowBackup="true"/android:allowBackup="false"/g' android/app/src/main/AndroidManifest.xml
            if ! grep -q 'dataExtractionRules' android/app/src/main/AndroidManifest.xml; then
              sed -i 's/android:allowBackup="false"/android:allowBackup="false" android:fullBackupOnly="false" android:dataExtractionRules="@xml\/data_extraction_rules" android:fullBackupContent="@xml\/backup_rules"/g' android/app/src/main/AndroidManifest.xml
            fi
          fi

      - name: "[Luồng 1 - APK] Assemble Android APK"
        if: steps.auto_version.outputs.BUILD_AAB != 'true'
        run: |
          cd android
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> gradle.properties
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cd ..

      - name: "[Luồng 1 - APK] Collect and Rename APK"
        if: steps.auto_version.outputs.BUILD_AAB != 'true'
        run: |
          test -f "android/app/build/outputs/apk/release/app-release.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "khosach_v${{ steps.auto_version.outputs.NAME }}.apk"
          echo "APK created: khosach_v${{ steps.auto_version.outputs.NAME }}.apk"

      - name: "[Luồng 1 - APK] Create/Update GitHub Release"
        if: steps.auto_version.outputs.BUILD_AAB != 'true'
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.auto_version.outputs.NAME }}
          name: Phiên bản v${{ steps.auto_version.outputs.NAME }}
          body: |
            Bản dựng APK Android tự động cho ứng dụng Quản Lý Kho Sách Cá Nhân.
            - Hỗ trợ tính năng tự động phát hiện và cài đặt bản cập nhật mới trực tiếp.
          files: khosach_v${{ steps.auto_version.outputs.NAME }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "[Luồng 1 - APK] Update version.json"
        if: steps.auto_version.outputs.BUILD_AAB != 'true'
        run: |
          APK_URL="https://github.com/tuanta3012/khosach/releases/download/v${{ steps.auto_version.outputs.NAME }}/khosach_v${{ steps.auto_version.outputs.NAME }}.apk"
          cat <<EOF > version.json
          {
            "version": "${{ steps.auto_version.outputs.NAME }}",
            "notes": "Cập nhật Kho Sách Cá Nhân v${{ steps.auto_version.outputs.NAME }}",
            "apkUrl": "$APK_URL"
          }
          EOF
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json keystore/debug.keystore.b64 2>/dev/null || git add version.json
          git commit -m "chore: auto-update version.json & keystore [skip ci]" || echo "No changes to commit"
          git push

      # =======================================================================
      # LUỒNG 2: BUILD BẢN AAB (GOOGLE PLAY STORE - AUTO UPDATE CLEANED & ARTIFACT ONLY)
      # =======================================================================
      - name: "[Luồng 2 - AAB] Build Web Assets (Auto Update DISABLED / Play Store Compliance)"
        if: steps.auto_version.outputs.BUILD_AAB == 'true'
        run: |
          npm run build
          npx cap sync android
          if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
            sed -i 's/android:allowBackup="true"/android:allowBackup="false"/g' android/app/src/main/AndroidManifest.xml
            if ! grep -q 'dataExtractionRules' android/app/src/main/AndroidManifest.xml; then
              sed -i 's/android:allowBackup="false"/android:allowBackup="false" android:fullBackupOnly="false" android:dataExtractionRules="@xml\/data_extraction_rules" android:fullBackupContent="@xml\/backup_rules"/g' android/app/src/main/AndroidManifest.xml
            fi
          fi

      - name: "[Luồng 2 - AAB] Bundle Android App Bundle (AAB)"
        if: steps.auto_version.outputs.BUILD_AAB == 'true'
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon
          cd ..

      - name: "[Luồng 2 - AAB] Collect and Rename AAB"
        if: steps.auto_version.outputs.BUILD_AAB == 'true'
        run: |
          test -f "android/app/build/outputs/bundle/release/app-release.aab"
          cp android/app/build/outputs/bundle/release/app-release.aab "khosach_v${{ steps.auto_version.outputs.NAME }}.aab"
          echo "AAB created: khosach_v${{ steps.auto_version.outputs.NAME }}.aab"

      - name: "[Luồng 2 - AAB] Upload AAB to GitHub Actions Artifacts"
        if: steps.auto_version.outputs.BUILD_AAB == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: khosach-v${{ steps.auto_version.outputs.NAME }}-aab
          path: khosach_v${{ steps.auto_version.outputs.NAME }}.aab
          retention-days: 30
          if-no-files-found: error
