<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <style>
      .book-outline { stroke: #1a202c; stroke-width: 14; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Background Canvas: Warm Taupe / Sand Beige -->
  <rect width="1024" height="1024" fill="#d7c3b0" />

  <!-- 1. TOP BOOK (Emerald Green) -->
  <g id="top-book">
    <rect x="116" y="200" width="740" height="188" rx="56" fill="#00b875" class="book-outline" />
    <!-- White Spine Label -->
    <rect x="764" y="230" width="68" height="128" rx="4" fill="#e6fcf5" />
  </g>

  <!-- 2. MIDDLE BOOK (Cerulean Blue) -->
  <g id="middle-book">
    <rect x="208" y="425" width="662" height="188" rx="56" fill="#0084d6" class="book-outline" />
    <!-- White Spine Label -->
    <rect x="776" y="455" width="68" height="128" rx="4" fill="#e8f4fc" />
  </g>

  <!-- 3. BOTTOM BOOK (Warm Terracotta Orange-Red) -->
  <g id="bottom-book">
    <rect x="142" y="650" width="796" height="188" rx="56" fill="#e85600" class="book-outline" />
    <!-- Pale Cream Spine Label -->
    <rect x="830" y="680" width="80" height="128" rx="4" fill="#fef9c3" />
  </g>

  <!-- 4. HANGING BOOKMARK RIBBON (Golden Amber / Orange) -->
  <!-- Hanging down over the blue book with bottom triangular notch over the orange book -->
  <g id="bookmark-ribbon">
    <path d="M 330 388 L 434 388 L 434 705 L 382 650 L 330 705 Z" fill="#ea8c00" class="book-outline" />
  </g>
</svg>
